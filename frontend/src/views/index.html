<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryVerse - Kumpulan Cerita Pendek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Merriweather", "serif"], // Bagus untuk teks cerita panjang
            },
            colors: {
              primary: "#4F46E5", // Indigo 600
            },
          },
        },
      };
    </script>
    <style>
      /* Tambahan styling untuk teks cerita agar enak dibaca */
      .story-content p {
        margin-bottom: 1.5em;
        line-height: 1.8;
        font-size: 1.125rem; /* 18px */
        color: #374151; /* Gray 700 */
      }
      /* Menyembunyikan halaman yang tidak aktif */
      .hidden-page {
        display: none;
      }
    </style>
  </head>
  <body class="bg-gray-50 font-sans text-gray-800">
    <nav
      class="bg-white border-b border-gray-200 fixed w-full z-50 top-0 shadow-sm"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <a href="#home" class="flex items-center gap-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="w-8 h-8 text-primary"
            >
              <path
                d="M11.25 4.533A9.707 9.707 0 006 3a9.735 9.735 0 00-3.25.555.75.75 0 00-.5.707v14.25a.75.75 0 001 .75c.739 0 1.46-.088 2.153-.252a10.06 10.06 0 013.247-.538 10.063 10.063 0 013.465.61c.738.227 1.519.377 2.319.433v-14.5c-.715-.078-1.417-.218-2.102-.414a9.695 9.695 0 00-2.833-.485 9.695 9.695 0 00-2.25.265z"
              />
              <path
                d="M12.75 4.533c.739.179 1.507.27 2.25.265a9.695 9.695 0 012.833.485c.685.196 1.387.336 2.102.414v14.5c-.8-.056-1.581-.206-2.319-.433a10.063 10.063 0 00-3.465-.61 10.06 10.06 0 00-2.153.252.75.75 0 01-1-.75V4.533z"
              />
            </svg>
            <span class="font-bold text-xl text-gray-900">StoryVerse</span>
          </a>
        </div>
      </div>
    </nav>

    <main class="pt-24 pb-20 min-h-screen">
      <section id="home-page" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-12">
          <h1 class="text-4xl font-extrabold text-gray-900 mb-4">
            Jelajahi Cerita Pilihan
          </h1>
          <p class="text-lg text-gray-600 max-w-2xl mx-auto">
            Temukan berbagai kisah menarik dari petualangan fantasi hingga
            misteri modern, dikurasi khusus untuk Anda.
          </p>
        </div>

        <div
          id="story-grid"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
        ></div>
      </section>

      <section
        id="detail-page"
        class="hidden-page max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 relative"
      >
        <a
          href="#home"
          class="inline-flex items-center text-primary hover:text-indigo-800 font-semibold mb-6 transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-5 h-5 mr-2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
            />
          </svg>
          Kembali ke Daftar
        </a>

        <div class="mb-8">
          <span
            id="detail-category"
            class="text-primary font-semibold text-sm tracking-wider uppercase"
            >Kategori</span
          >
          <h1
            id="detail-title"
            class="text-4xl md:text-5xl font-extrabold text-gray-900 mt-2 mb-4 leading-tight"
          >
            Judul Cerita Disini
          </h1>
          <div class="flex items-center text-gray-500 text-sm mb-6 space-x-4">
            <span id="detail-author">Oleh Penulis</span>
            <span>•</span>
            <span id="detail-date">12 Jan 2024</span>
          </div>

          <img
            id="detail-image"
            src=""
            alt="Story Cover"
            class="w-full h-[400px] object-cover rounded-2xl shadow-lg mb-8"
          />

          <div
            class="bg-white border border-gray-200 p-4 rounded-xl shadow-sm flex items-center justify-between sticky top-20 z-10"
          >
            <div class="flex items-center gap-3">
              <span class="font-semibold text-gray-700">Dengarkan Cerita:</span>
            </div>
            <div class="flex gap-3">
              <button
                id="tts-play-btn"
                class="flex items-center gap-2 bg-primary hover:bg-indigo-700 text-white px-5 py-2.5 rounded-full font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  class="w-5 h-5"
                >
                  <path
                    fill-rule="evenodd"
                    d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z"
                    clip-rule="evenodd"
                  />
                </svg>
                Play
              </button>
              <button
                id="tts-stop-btn"
                disabled
                class="flex items-center gap-2 bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 px-5 py-2.5 rounded-full font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="rgb(79 70 229)"
                  class="w-5 h-5"
                >
                  <path
                    fill-rule="evenodd"
                    d="M4.5 7.5a3 3 0 013-3h9a3 3 0 013 3v9a3 3 0 01-3 3h-9a3 3 0 01-3-3v-9z"
                    clip-rule="evenodd"
                  />
                </svg>
                Stop
              </button>
            </div>
          </div>
        </div>

        <article
          id="detail-content"
          class="story-content font-serif text-gray-800"
        ></article>
      </section>
    </main>

    <script>
      // 1. Data Dummy Cerita (Simulasi Database)
      const storiesData = [
        {
          id: 1,
          title: "Hutan Bisikan Kuno",
          category: "Fantasi",
          author: "Raka Aditya",
          date: "20 Mei 2024",
          image:
            "https://images.unsplash.com/photo-1448375240586-882707db888b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
          excerpt:
            "Seorang penjelajah menemukan hutan yang tidak tercatat di peta, di mana pohon-pohonnya tampak berbisik menceritakan rahasia masa lalu...",
          content: `
                    <p>Hutan itu tidak ada di peta manapun. Penduduk desa setempat menyebutnya "Hutan Bisikan", sebuah tempat yang dihindari selama beberapa generasi. Namun, bagi Elias, seorang kartografer yang terobsesi dengan yang belum terjamah, peringatan itu justru adalah undangan.</p>
                    <p>Saat dia melangkah melewati batas pepohonan pertama, udara berubah menjadi dingin dan berat. Cahaya matahari tersaring melalui kanopi daun yang begitu tebal sehingga menciptakan suasana senja abadi. Awalnya, dia mengira suara itu hanya angin.</p>
                    <p>Desisan lembut, seperti daun kering yang bergesekan. Tapi semakin dalam dia berjalan, suara itu membentuk pola. Itu bukan angin; itu adalah kata-kata. Ribuan suara tumpang tindih, berbisik dalam bahasa kuno yang entah bagaimana terasa familiar di benaknya.</p>
                    <p>"Dia telah kembali..." satu suara berbisik tepat di telinganya.</p>
                    <p>Elias berbalik, jantungnya berdebar kencang. Tidak ada siapa-siapa. Dia menyentuh kulit pohon ek besar di sampingnya, dan sentakan energi menjalar ke lengannya. Pohon itu hangat, berdenyut pelan seolah memiliki detak jantung. Hutan ini hidup, dan hutan ini telah menunggunya.</p>
                `,
        },
        {
          id: 2,
          title: "Protokol NeuraLink: Kesadaran Ganda",
          category: "Sci-Fi",
          author: "Dr. Sarah Chen",
          date: "15 Mei 2024",
          image:
            "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
          excerpt:
            "Dalam eksperimen penghubung otak-komputer pertama, subjek uji mulai mengalami ingatan yang bukan miliknya. Sebuah glitch atau fitur tersembunyi?",
          content: `
                    <p>Lampu indikator di lab berkedip hijau stabil. Subjek 01, seorang pria bernama Marcus, duduk di kursi antarmuka dengan helm penuh kabel. Ini adalah uji coba manusia pertama untuk NeuraLink V5, sebuah chip yang dirancang untuk meningkatkan kapasitas memori.</p>
                    <p>"Bagaimana perasaanmu, Marcus?" tanya Dr. Sarah Chen melalui mikrofon.</p>
                    <p>Marcus membuka matanya. Pupil matanya sedikit melebar. "Aneh, Dok. Saya merasa... ramai."</p>
                    <p>Sarah mengerutkan kening melihat data di layarnya. Aktivitas gelombang otak di lobus temporal Marcus melonjak di luar parameter normal. "Ramai bagaimana? Bisa lebih spesifik?"</p>
                    <p>"Saya ingat sarapan pagi ini. Telur dadar. Tapi..." Marcus berhenti, napasnya tercekat. "Tapi saya juga ingat... saya ingat berlari di ladang gandum berwarna ungu. Di bawah dua matahari. Dan rasa takut dikejar oleh sesuatu dari logam."</p>
                    <p>Tangan Sarah membeku di atas keyboard. Ladang gandum ungu dan dua matahari? Itu adalah deskripsi persis dari simulasi realitas virtual yang dia kembangkan secara rahasia lima tahun lalu—proyek yang sudah lama dia hapus. Bagaimana Marcus bisa mengaksesnya melalui chip memori kosong?</p>
                `,
        },
        {
          id: 3,
          title: "Kafe di Ujung Waktu",
          category: "Misteri Ringan",
          author: "Budi Santoso",
          date: "10 Mei 2024",
          image:
            "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
          excerpt:
            "Ada sebuah kafe kecil yang hanya muncul saat hujan turun di hari Selasa. Mereka menyajikan kopi terbaik dan kesempatan untuk memperbaiki satu penyesalan.",
          content: `
                    <p>Orang-orang bilang kau tidak bisa mencari Kafe Chronos. Kafe itu yang akan menemukanmu, biasanya saat kau sedang berada di titik terendah dan hujan turun di hari Selasa.</p>
                    <p>Bagi Maya, hari itu adalah Selasa kelabu setelah dia dipecat dari pekerjaan impiannya. Dia berteduh di sebuah gang sempit, air mata bercampur dengan air hujan di wajahnya. Saat itulah dia melihatnya: sebuah pintu kayu ek dengan lonceng kuningan kecil dan papan nama bertuliskan "Kafe Chronos - Buka Sejak Kemarin, Tutup Besok".</p>
                    <p>Dia masuk. Aroma kopi yang kaya dan kayu tua menyambutnya. Hanya ada satu barista, seorang pria tua dengan jam saku yang tergantung di rompinya. "Selamat datang," katanya dengan senyum ramah. "Waktunya tepat sekali."</p>
                    <p>Maya duduk di bangku bar. "Satu latte, tolong."</p>
                    <p>Pria tua itu menyodorkan menu. Hanya ada satu item: 'Kopi Penyesalan - Harga: Satu Kenangan Buruk'. "Kami tidak menerima uang di sini, Nona. Kami menerima beban masa lalu. Minum ini, dan kau akan mendapatkan kesempatan satu jam untuk kembali ke momen yang paling kau sesali."</p>
                    <p>Maya menatap cangkir yang baru saja diletakkan di depannya. Uapnya mengepul, membentuk pusaran yang menghipnotis. Satu jam untuk memperbaiki wawancara kerja itu? Tawaran yang terlalu bagus untuk menjadi kenyataan, tapi terlalu menggoda untuk ditolak.</p>
                `,
        },
        // Tambahkan cerita lain di sini jika perlu
      ];

      // 2. Variabel Global untuk TTS
      let speechUtterance = null;
      const playBtn = document.getElementById("tts-play-btn");
      const stopBtn = document.getElementById("tts-stop-btn");
      const contentContainer = document.getElementById("detail-content");

      // 3. Fungsi Render Halaman Home (Grid)
      function renderHomegrid() {
        const gridContainer = document.getElementById("story-grid");
        gridContainer.innerHTML = ""; // Bersihkan konten lama

        storiesData.forEach((story) => {
          const cardHTML = `
                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300 border border-gray-100 flex flex-col h-full group">
                        <div class="relative h-64 overflow-hidden">
                            <img src="${story.image}" alt="${story.title}" class="w-full h-full object-cover transform group-hover:scale-105 transition duration-500">
                            <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm text-primary text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                                ${story.category}
                            </div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <h2 class="text-2xl font-bold text-gray-900 mb-3 leading-snug hover:text-primary transition">
                                <a href="#story=${story.id}">${story.title}</a>
                            </h2>
                            <p class="text-gray-600 mb-6 flex-grow line-clamp-3">${story.excerpt}</p>
                            <div class="flex justify-between items-center mt-auto pt-4 border-t border-gray-100">
                                <span class="text-sm text-gray-500">${story.author}</span>
                                <a href="#story=${story.id}" class="inline-flex items-center text-primary font-semibold hover:text-indigo-800 transition">
                                    Baca Cerita
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 ml-2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                                    </svg>                                      
                                </a>
                            </div>
                        </div>
                    </div>
                `;
          gridContainer.insertAdjacentHTML("beforeend", cardHTML);
        });
      }

      // 4. Fungsi Render Halaman Detail
      function renderDetailPage(storyId) {
        const story = storiesData.find((s) => s.id === parseInt(storyId));

        if (!story) {
          document.getElementById("detail-title").innerText =
            "Cerita Tidak Ditemukan";
          document.getElementById("detail-content").innerHTML = "";
          return;
        }

        // Inject Data ke Elemen HTML
        document.getElementById("detail-category").innerText = story.category;
        document.getElementById("detail-title").innerText = story.title;
        document.getElementById(
          "detail-author"
        ).innerText = `Oleh ${story.author}`;
        document.getElementById("detail-date").innerText = story.date;
        document.getElementById("detail-image").src = story.image;
        document.getElementById("detail-content").innerHTML = story.content;

        // Reset TTS state saat masuk halaman baru
        stopTTS();
      }

      // 5. Fungsi Routing Sederhana (Menggunakan Hash URL)
      function handleRouting() {
        const hash = window.location.hash;
        const homePage = document.getElementById("home-page");
        const detailPage = document.getElementById("detail-page");

        // Scroll ke atas setiap kali pindah halaman
        window.scrollTo(0, 0);

        if (hash === "" || hash === "#home") {
          // Tampilkan Home, Sembunyikan Detail
          homePage.classList.remove("hidden-page");
          detailPage.classList.add("hidden-page");
          stopTTS(); // Pastikan TTS berhenti jika kembali ke home
        } else if (hash.startsWith("#story=")) {
          // Ambil ID dari hash, contoh: #story=1 -> "1"
          const storyId = hash.split("=")[1];
          // Tampilkan Detail, Sembunyikan Home
          homePage.classList.add("hidden-page");
          detailPage.classList.remove("hidden-page");
          renderDetailPage(storyId);
        }
      }

      // 6. Fungsi Text-to-Speech (TTS)
      function setupTTS() {
        if (!("speechSynthesis" in window)) {
          alert("Maaf, browser Anda tidak mendukung fitur Text-to-Speech.");
          playBtn.disabled = true;
          return;
        }

        playBtn.addEventListener("click", () => {
          // Batalkan suara yang sedang berjalan sebelumnya (jika ada)
          window.speechSynthesis.cancel();

          // Ambil teks bersih dari konten cerita (tanpa tag HTML)
          const textToRead = contentContainer.innerText;

          speechUtterance = new SpeechSynthesisUtterance(textToRead);

          // Opsional: Atur Bahasa (id-ID untuk Indonesia jika tersedia di OS/Browser user)
          // speechUtterance.lang = 'id-ID';
          speechUtterance.rate = 1; // Kecepatan normal
          speechUtterance.pitch = 1; // Nada normal

          // Event saat mulai dan selesai bicara untuk update UI
          speechUtterance.onstart = () => {
            playBtn.disabled = true;
            stopBtn.disabled = false;
            playBtn.classList.add("opacity-50", "cursor-not-allowed");
          };

          speechUtterance.onend = () => {
            resetTTSUI();
          };

          speechUtterance.onerror = (e) => {
            console.error("TTS Error:", e);
            resetTTSUI();
          };

          window.speechSynthesis.speak(speechUtterance);
        });

        stopBtn.addEventListener("click", stopTTS);
      }

      function stopTTS() {
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
        }
        resetTTSUI();
      }

      function resetTTSUI() {
        playBtn.disabled = false;
        stopBtn.disabled = true;
        playBtn.classList.remove("opacity-50", "cursor-not-allowed");
      }

      // 7. Inisialisasi Aplikasi
      document.addEventListener("DOMContentLoaded", () => {
        renderHomegrid(); // Render kartu di awal
        handleRouting(); // Cek halaman mana yang harus ditampilkan
        setupTTS(); // Siapkan fitur TTS

        // Dengarkan perubahan URL hash untuk navigasi
        window.addEventListener("hashchange", handleRouting);
      });
    </script>
  </body>
</html>
